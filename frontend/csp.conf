# CSP for the SPA only.  Not applied to the proxied /api/ and /admin/ locations:
# Swagger UI and the Django admin rely on inline scripts this policy forbids.
# Razorpay Checkout (script + frame + XHR) and Cloudflare Stream (HLS media) are
# the only third-party origins the SPA talks to.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob: https://*.cloudflarestream.com; connect-src 'self' https://*.cloudflarestream.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://*.cloudflarestream.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
