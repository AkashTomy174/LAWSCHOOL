# ---------------------------------------------------------------------------
# Nginx config for the LawSchool SPA container.
#
# Serves the built bundle and proxies /api to the backend service so the browser
# sees a single origin -- which keeps CORS and CSRF behaviour identical to
# production and avoids a preflight on every request.
# ---------------------------------------------------------------------------

upstream lawschool_backend {
    # "backend" is the compose service name.
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --- compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # --- API proxy --------------------------------------------------------
    # Proxying here (rather than calling the API cross-origin) means the SPA can
    # use a relative VITE_API_BASE_URL and never needs a CORS preflight.
    location /api/ {
        proxy_pass http://lawschool_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://lawschool_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://lawschool_backend;
        proxy_set_header Host $host;
    }

    # --- static assets ----------------------------------------------------
    # Vite emits content-hashed filenames, so they can be cached immutably.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA history fallback --------------------------------------------
    # Without this a hard refresh on /courses/constitutional-law would 404: the
    # route exists only in the client-side router.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html must never be cached, or users get a stale app shell that
        # references asset hashes that no longer exist after a deploy.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}